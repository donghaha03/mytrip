name: tripapp
description: "환율 여행 장부앱 프로토타입"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  mock_exceptions: ^0.8.2

flutter:
  uses-material-design: true

  # Pretendard (SIL Open Font License 1.1, assets/fonts/OFL.txt)
  # 앱이 쓰는 굵기만 넣는다: 400/500/600/700
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
