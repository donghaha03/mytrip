name: tripapp
description: "환율 여행 장부앱 프로토타입"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  google_sign_in: ^7.2.0
  http: ^1.2.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  cloud_firestore_platform_interface: ^8.0.7
  firebase_auth_platform_interface: ^9.1.0
  firebase_core_platform_interface: ^8.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Pretendard (SIL Open Font License 1.1, assets/fonts/OFL.txt)
  # 앱이 쓰는 굵기만 넣는다: 400/500/600/700
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
