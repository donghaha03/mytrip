name = "mytrip-receipt"
main = "worker.mjs"
compatibility_date = "2026-10-06"
workers_dev = true

# Send model requests from one fixed US region instead of whichever edge is nearest the user.
[placement]
region = "gcp:us-east4"

# No receipt/photo/response logs. The binding stores anonymous usage counts only.
[observability]
enabled = false

[vars]
RECEIPT_ALLOWED_ORIGINS = "https://donghaha03.github.io"
# Secrets (wrangler secret put): ANTHROPIC_API_KEY, RECEIPT_ACCESS_CODE. See README.
# yes = anyone who accepts the in-app consent may use it, within the usage limits.
RECEIPT_PUBLIC_CONSENT = "yes"

[[durable_objects.bindings]]
name = "RECEIPT_USAGE"
class_name = "ReceiptUsage"

[[migrations]]
tag = "receipt-usage-v1"
new_sqlite_classes = ["ReceiptUsage"]
