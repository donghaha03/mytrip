name: iOS app build

on:
  push:
    branches: [main]
    paths: ['lib/**', 'ios/**', 'assets/**', 'pubspec.*', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # Compile the real iOS target without creating or exposing signing credentials.
      # This artifact is NOT an installable IPA. Signing is required for an iPhone.
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/mytrip-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mytrip-ios-unsigned
          path: build/mytrip-ios-unsigned.zip
          retention-days: 7
