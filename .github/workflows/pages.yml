name: Deploy to GitHub Pages

# main 에 합쳐지면 웹으로 빌드해서 https://<계정>.github.io/<repo>/ 에 올린다.
#   /<repo>/      본 앱 (팀 화면 그대로)
#   /<repo>/ocr/  영수증 인식 단독 화면 (lib/OCR)
# 처음 한 번: repo Settings -> Pages -> Source 를 "GitHub Actions" 로 바꿀 것.
on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 push 하면 앞의 배포는 취소하고 마지막 것만 올린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0 # pubspec 의 Dart ^3.13.2 / Flutter >=3.47.0 충족
          channel: stable
          cache: true

      # 팀 파일(lib/firebase_options.dart)은 저장소에서 그대로 두고, 이 빌드 폴더에서만
      # 개인 Firebase 프로젝트(mytrip-fddfb) 설정으로 바꿔 끼운다. 커밋하지 않는다.
      - name: Use my Firebase project for this build only
        run: cp deploy/firebase_options_mytrip.dart lib/firebase_options.dart

      - run: flutter pub get

      # <계정>.github.io/<repo>/ 처럼 하위 경로에 뜨므로 base-href 를 repo 이름으로.
      # repo 이름이 <계정>.github.io 이면 루트(/)에 뜬다.
      - name: Build web
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "base-href: $BASE"
          flutter build web --release --no-wasm-dry-run --base-href "$BASE"
          flutter build web --release --no-wasm-dry-run -t lib/OCR/main_ocr.dart \
            --base-href "${BASE}ocr/" -o build/ocr
          cp -r build/ocr build/web/ocr

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
