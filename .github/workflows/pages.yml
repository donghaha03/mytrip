name: Deploy to GitHub Pages

# main 에 합쳐지면 자동으로 빌드해서 https://<계정>.github.io/<repo>/ 에 올린다.
#
# naite-reservation 은 순수 HTML 이라 main 브랜치 루트를 그대로 서빙하지만,
# Flutter 는 빌드 결과물(build/web)을 올려야 해서 Actions 로 배포한다.
#
# 처음 한 번: repo Settings -> Pages -> Source 를 "GitHub Actions" 로 바꿀 것.
on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 push 하면 앞의 배포는 취소하고 마지막 것만 올린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      # 깨진 채로 배포되지 않게 여기서도 한 번 더 막는다
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test

      # <계정>.github.io/<repo>/ 처럼 하위 경로에 뜨므로 base-href 를 repo 이름으로.
      # repo 이름이 <계정>.github.io 이면 루트(/)에 뜬다.
      - name: Build web
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "base-href: $BASE"
          flutter build web --release --no-wasm-dry-run --base-href "$BASE"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
