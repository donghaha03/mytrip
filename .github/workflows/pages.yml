name: Deploy to GitHub Pages

# main 에 합쳐지면 자동으로 빌드해서 https://<계정>.github.io/<repo>/ 에 올린다.
# 처음 한 번: repo Settings -> Pages -> Source 를 "GitHub Actions" 로 바꿀 것.
on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행
  # ponytail: 무료 예약은 지연·60일 무활동 중지 가능; 정각/상시 운영 필요 시 전용 스케줄러.
  schedule:
    - cron: '0 21 * * *' # UTC 21:00 = 한국 시간 다음 날 06:00. 실행·배포 지연 가능.

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 push 하면 앞의 배포는 취소하고 마지막 것만 올린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      # 깨진 채로 배포되지 않게 여기서도 한 번 더 막는다
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test
      - run: node tool/update_rates.mjs --check
      - run: node --test test/receipt_camera_test.mjs

      # <계정>.github.io/<repo>/ 처럼 하위 경로에 뜨므로 base-href 를 repo 이름으로.
      # repo 이름이 <계정>.github.io 이면 루트(/)에 뜬다.
      - name: Build web
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "base-href: $BASE"
          flutter build web --release --no-wasm-dry-run --base-href "$BASE"

      - name: Configure receipt server
        run: node tool/configure_receipts.mjs
        env:
          RECEIPT_SERVER_URL: ${{ vars.RECEIPT_SERVER_URL }}

      # 실패하면 배포를 중단하므로 마지막 정상 환율과 앱이 그대로 남는다.
      - name: Update daily rates
        run: node tool/update_rates.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
