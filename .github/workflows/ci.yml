name: CI

# push 한 모든 브랜치 + main 으로 보내는 PR 을 검사한다.
# 두 사람이 각자 만든 걸 합칠 때 깨진 채로 들어가는 걸 막는 용도.
# 브랜치 push 에서도 도는 이유: PR 을 열기 전에, 그리고 Windows 에서 로컬
# flutter 가 막혀 있을 때도 analyze·test 결과를 볼 수 있어야 한다.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tool/update_rates.mjs --check
      - run: node --test test/receipt_camera_test.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server/card
      - run: npm test
        working-directory: server/card
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: server/card

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      # 경고 하나라도 있으면 실패시킨다. 지금 저장소는 0건 상태다.
      - run: flutter analyze --fatal-infos --fatal-warnings

      - run: flutter test

      # 웹 빌드까지 되는지 확인 (배포가 웹이라서)
      - run: flutter build web --release --no-wasm-dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: build/web
          retention-days: 3
